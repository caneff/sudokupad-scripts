name: Fuzz pull request

# Advisory (#1030): main has no branch protection, so this is not a required check; a red run is read, not waited on, and it files no issue. A red run leaves one
# comment on the pull request (edited on a later push) with the seed and the failure. A change to the fuzz harness alone does not start it:
# its own tests (`npm test`) cover that, and the scripts it fuzzes are not in the diff.
on:
  pull_request:
    paths:
      - auto-rules-resizer.user.js
      - color-by-digit.user.js
      - dark-page.user.js
      - pen-tool-extras.user.js
      - text-anywhere.user.js
      - ui-tweaks.user.js
      - lib/**

permissions:
  contents: read
  pull-requests: write

# A new push to the pull request makes the run on the old one worthless.
concurrency:
  group: fuzz-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          # The changed scripts are read from the diff against the base.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: fuzz
        run: |
          set -o pipefail
          # An assignment, so a git error fails the step (`bash -e`) instead of reading as "nothing changed".
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- '*.user.js')
          focus=()
          for file in $changed; do
            # draw-tool.user.js is a frozen handover and logic-masters-puzzle-preview.user.js runs on another site: no fuzz page installs either.
            case "$file" in draw-tool.user.js|logic-masters-puzzle-preview.user.js) ;; *) focus+=(--focus "${file%.user.js}") ;; esac
          done
          echo "focus: ${focus[*]:-none (a change to lib/ or the fuzz only)}"
          npm run test:fuzz -- --minutes 5 --shrink-minutes 3 "${focus[@]}" 2>&1 | tee "$RUNNER_TEMP/fuzz.out"
        env:
          BASE_REF: ${{ github.base_ref }}
      # The step above exits 0 on a run that fuzzed zero action lists, and has no output at all when something before it failed: this step
      # fails both, so neither reads as a pass, and writes the comment (live/fuzz/pr-verdict.mjs).
      - id: verdict
        if: ${{ !cancelled() }}
        run: node live/fuzz/pr-verdict.mjs "$RUNNER_TEMP/fuzz.out" "$RUNNER_TEMP/fuzz-comment.md" "$FUZZ_OUTCOME" "$HEAD_SHA" "$RUN_URL"
        env:
          FUZZ_OUTCOME: ${{ steps.fuzz.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Show the failure in the job summary
        if: ${{ failure() && steps.fuzz.outcome == 'failure' }}
        run: |
          {
            echo '## Fuzz failed'
            echo
            echo 'The seed, the shrunk steps and the replay command are in the output below; the replay command runs the failure again on your machine.'
            echo
            echo '```'
            cat "$RUNNER_TEMP/fuzz.out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # One comment per pull request, found by its first line: a red run creates it or edits it, and a later green run edits an earlier red one to say it passed, so the pull
      # request never keeps a stale failure. A fork's token cannot comment, so a fork's pull request has none.
      - name: Comment the result on the pull request
        if: ${{ !cancelled() && (steps.verdict.outcome == 'success' || steps.verdict.outcome == 'failure') && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- fuzz-pr -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/fuzz-comment.md" > /dev/null
          elif [ "$VERDICT" = failure ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/fuzz-comment.md"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          VERDICT: ${{ steps.verdict.outcome }}
