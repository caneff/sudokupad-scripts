name: Watch SudokuPad

# Nightly: checks SudokuPad's version with one request; a new version, or a week since the last full run, runs the full
# live suite and a red one files a `bug` issue; a run that cannot reach the checks files a "did not run" issue
# (live/watch.mjs). Then `npm run test:tampermonkey` installs every script into a real Tampermonkey.
# `workflow_dispatch` is the manual run.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Two overlapping runs on a new version would each file the bug.
concurrency:
  group: watch-sudokupad
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      CACHE_PATH: ~/.cache/sudokupad-scripts/live
      CACHE_KEY: sudokupad-live-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The recording is SudokuPad's own code: the Actions cache only, never the repo or an artifact. A cache entry
      # cannot be overwritten, so each run attempt saves under its own key and restores the newest by prefix.
      - uses: actions/cache/restore@v6
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ env.CACHE_KEY }}
          restore-keys: sudokupad-live-
      - id: watch
        run: npm run watch:live
        env:
          GH_TOKEN: ${{ github.token }}
      # A red run files its bug and remembers the version, so the save runs after a failed step too: otherwise the
      # next night checks the same version again and files a second bug.
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() }}
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ env.CACHE_KEY }}
      # A step before the watch (npm ci, the Chromium install, the cache restore) failed, so live/watch.mjs never ran and
      # filed nothing. Same title as watch.mjs's own "did not run" issue, and filed only when none is open.
      - name: File the did-not-run issue
        if: ${{ failure() && steps.watch.outcome == 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Watch did not run: the live suite could not be checked'
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json title --jq '.[].title')
          if printf '%s\n' "$open" | grep -qxF "$TITLE"; then exit 0; fi
          gh issue create --repo "$GITHUB_REPOSITORY" --label bug --title "$TITLE" \
            --body "A step before \`npm run watch:live\` failed (npm ci, the Chromium install or the cache restore), so the live suite was not checked. Nothing was remembered. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
      # After the save, so Tampermonkey is never in the cache and each night fetches the current one: a new Tampermonkey
      # shows up within a day. It runs after a red watch too (live/README.md § The Tampermonkey test).
      - run: npm run test:tampermonkey
        if: ${{ !cancelled() }}
