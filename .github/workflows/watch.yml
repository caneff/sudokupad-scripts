name: Watch SudokuPad

# The full live suite, every night (#1026): the backstop for a merge that ran only the live files its change touched (live/README.md § The daily watch).

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # live/watch.mjs reads the run before this one, to see that a night was skipped.
  actions: read

# Two overlapping runs would each file the bug.
concurrency:
  group: watch-sudokupad
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-repo
        with:
          playwright: true
      # The recording is SudokuPad's own code: it is made again for every run and kept nowhere (not the repo, an artifact or the Actions cache).
      - id: watch
        run: npm run watch:live
        env:
          GH_TOKEN: ${{ github.token }}
      # A step before the watch (npm ci, the Chromium install) failed, so live/watch.mjs never ran and
      # filed nothing. Same title as watch.mjs's own "did not run" issue, and filed only when none is open.
      - name: File the did-not-run issue
        if: ${{ failure() && steps.watch.outcome == 'skipped' }}
        uses: ./.github/actions/file-issue-once
        with:
          title: 'Watch did not run: the live suite could not be checked'
          body: "A step before `npm run watch:live` failed (npm ci or the Chromium install), so the live suite was not checked. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
      # Each night fetches the current Tampermonkey, so a new one shows up within a day. It runs after a red watch too, but not when the watch never ran, which the did-not-run
      # issue already covers (live/README.md § The Tampermonkey test).
      - id: tampermonkey
        run: npm run test:tampermonkey
        if: ${{ !cancelled() && steps.watch.outcome != 'skipped' }}
      - name: File the Tampermonkey issue
        if: ${{ failure() && steps.tampermonkey.outcome == 'failure' }}
        uses: ./.github/actions/file-issue-once
        with:
          title: 'Tampermonkey test fails: a script does not install or run in real Tampermonkey'
          body: "`npm run test:tampermonkey` failed in the nightly watch. A new Tampermonkey, or an outage at tampermonkey.net, raw.githubusercontent.com or Google's CRX endpoint, fails it too. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
