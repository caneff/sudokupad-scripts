name: Watch SudokuPad

# Nightly: checks SudokuPad's version with one request; a new version runs the full live suite and a red one files a
# `bug` issue (live/watch.mjs), then `npm run test:tampermonkey` installs every script into a real Tampermonkey.
# `workflow_dispatch` is the manual run.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Two overlapping runs on a new version would each file the bug.
concurrency:
  group: watch-sudokupad
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      CACHE_PATH: ~/.cache/sudokupad-scripts/live
      CACHE_KEY: sudokupad-live-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The recording is SudokuPad's own code: the Actions cache only, never the repo or an artifact. A cache entry
      # cannot be overwritten, so each run attempt saves under its own key and restores the newest by prefix.
      - uses: actions/cache/restore@v6
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ env.CACHE_KEY }}
          restore-keys: sudokupad-live-
      - run: npm run watch:live
        env:
          GH_TOKEN: ${{ github.token }}
      # A red run files its bug and remembers the version, so the save runs after a failed step too: otherwise the
      # next night checks the same version again and files a second bug.
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() }}
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ env.CACHE_KEY }}
      # After the save, so Tampermonkey is never in the cache and each night fetches the current one: a new Tampermonkey
      # shows up within a day. It runs after a red watch too (live/README.md § The Tampermonkey test).
      - run: npm run test:tampermonkey
        if: ${{ !cancelled() }}
